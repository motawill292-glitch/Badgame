<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Escolar Avançada</title>

<style>
body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.calculadora {
    background: rgba(20, 20, 30, 0.85);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 20px;
    width: 360px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
}

.display {
    width: 100%;
    min-height: 70px;
    background: #000;
    color: #00ff9c;
    font-size: 26px;
    text-align: right;
    padding: 12px;
    border-radius: 12px;
    box-sizing: border-box;
    margin-bottom: 15px;
    overflow-x: auto;
    word-break: break-all;
}

.botoes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 52px;
    font-size: 15px;
    border: none;
    border-radius: 12px;
    background: #2a2f45;
    color: white;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
}

button:hover {
    background: #3b4266;
}

button:active {
    transform: scale(0.95);
}

.operador {
    background: #ff9f0a;
    color: #000;
}

.operador:hover {
    background: #ffb340;
}

.igual {
    background: #34c759;
    grid-column: span 2;
    color: #000;
}

.limpar {
    background: #ff453a;
}

.func {
    background: #5e5ce6;
}

.func:hover {
    background: #7a78ff;
}
</style>
</head>

<body>

<div class="calculadora">
    <div id="display" class="display">0</div>

    <div class="botoes">
        <button class="limpar" onclick="limpar()">C</button>
        <button onclick="backspace()">⌫</button>
        <button onclick="add('(')">(</button>
        <button onclick="add(')')">)</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="operador" onclick="add('/')">÷</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button class="operador" onclick="add('*')">×</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button class="operador" onclick="add('-')">−</button>

        <button onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
        <button class="igual" onclick="calcular()">=</button>
        <button class="operador" onclick="add('+')">+</button>

        <!-- FUNÇÕES AVANÇADAS -->
        <button class="func" onclick="add('Math.PI')">π</button>
        <button class="func" onclick="add('Math.E')">e</button>
        <button class="func" onclick="add('**')">xʸ</button>
        <button class="func" onclick="add('Math.sqrt(')">√</button>

        <button class="func" onclick="add('Math.sin(')">sin</button>
        <button class="func" onclick="add('Math.cos(')">cos</button>
        <button class="func" onclick="add('Math.tan(')">tan</button>
        <button class="func" onclick="fatorial()">n!</button>

        <button class="func" onclick="add('Math.log10(')">log</button>
        <button class="func" onclick="add('Math.log(')">ln</button>
        <button class="func" onclick="add('%')">%</button>
        <button class="func" onclick="add('Math.abs(')">|x|</button>
    </div>
</div>

<script>
const display = document.getElementById("display");

function add(valor) {
    if (display.innerText === "0") {
        display.innerText = valor;
    } else {
        display.innerText += valor;
    }
}

function limpar() {
    display.innerText = "0";
}

function backspace() {
    display.innerText = display.innerText.slice(0, -1);
    if (display.innerText === "") display.innerText = "0";
}

function fatorial() {
    try {
        let n = eval(display.innerText);
        if (n < 0 || !Number.isInteger(n)) {
            display.innerText = "Erro";
            return;
        }
        let res = 1;
        for (let i = 1; i <= n; i++) res *= i;
        display.innerText = res;
    } catch {
        display.innerText = "Erro";
    }
}

function calcular() {
    try {
        let resultado = eval(display.innerText);
        display.innerText = resultado;
    } catch {
        display.innerText = "Erro";
    }
}

// SUPORTE A TECLADO
document.addEventListener("keydown", e => {
    if ("0123456789+-*/().".includes(e.key)) {
        add(e.key);
    }
    if (e.key === "Enter") calcular();
    if (e.key === "Backspace") backspace();
    if (e.key === "Escape") limpar();
});
</script>

</body>
</html>
